plugins {
    id 'com.android.application'
}

def versionFile = file("../../version.txt")
def baseVersion = versionFile.exists() ? versionFile.text.trim() : "1.0.0"
def gitCommit = System.getenv("GIT_COMMIT_HASH") ?: "dev"
def fullDisplayVersion = "${baseVersion}+git${gitCommit}"

android {
    namespace 'com.veyqo.remote'
    compileSdk 34

    defaultConfig {
        applicationId "com.veyqo.remote"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName fullDisplayVersion
    }

    signingConfigs {
        release {
            /* Consistent fixed release keystore across all builds to prevent package signature conflicts */
            storeFile file("../veyqo-release.keystore")
            storePassword "veyqopassword"
            keyAlias "veyqokey"
            keyPassword "veyqopassword"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.code.gson:gson:2.10.1'
}
