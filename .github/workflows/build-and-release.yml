name: Build and Release

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  ACTIONS_RUNNER_FORCE_NODE24: "true"

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: ubuntu
            runner: ubuntu-26.04
            rid: linux-x64
            artifact_name: veyqo-desktop-linux-x64
            archive_name: veyqo-desktop-linux-x64.tar.gz
          - os: windows
            runner: windows-latest
            rid: win-x64
            artifact_name: veyqo-desktop-win-x64
            archive_name: veyqo-desktop-win-x64.zip

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Desktop Binary
        run: >
          dotnet publish desktop/Veyqo.Desktop.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -o dist/desktop/${{ matrix.rid }}

      - name: Archive Windows Artifact
        if: matrix.os == 'windows'
        shell: pwsh
        run: Compress-Archive -Path dist/desktop/${{ matrix.rid }}/* -DestinationPath dist/${{ matrix.archive_name }}

      - name: Archive Linux Artifact
        if: matrix.os == 'ubuntu'
        run: tar -czvf dist/${{ matrix.archive_name }} -C dist/desktop/${{ matrix.rid }} .

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.archive_name }}

  build-mobile:
    name: Build Android APK
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Android Release APK
        working-directory: mobile
        run: gradle assembleRelease --stacktrace

      - name: Upload Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: veyqo-mobile-apk
          path: mobile/app/build/outputs/apk/release/*.apk

  release:
    name: Publish GitHub Release
    if: github.event_name == 'workflow_dispatch'
    needs: [build-desktop, build-mobile]
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Detect Version and Generate Release Notes
        id: release_meta
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' desktop/Veyqo.Desktop.csproj || echo "1.0.0")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

          echo "## Veyqo Release ${TAG}" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "### Commit History" >> CHANGELOG.md
          git log -n 15 --pretty=format:"* [%h](https://github.com/${{ github.repository }}/commit/%H) - %s (@%an)" >> CHANGELOG.md
          echo "" >> CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Veyqo ${{ steps.release_meta.outputs.tag }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            release-artifacts/**/veyqo-desktop-*.zip
            release-artifacts/**/veyqo-desktop-*.tar.gz
            release-artifacts/**/*.apk
