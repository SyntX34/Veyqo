name: Build and Release

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.1). Leave blank to auto-detect from project source.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-desktop-linux:
    name: Build Desktop (Linux Deb & Tar)
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Publish Linux Desktop Binary
        run: >
          dotnet publish desktop/Veyqo.Desktop.csproj
          -c Release
          -r linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o dist/desktop/linux-x64

      - name: Build Debian (.deb) Installer Package
        run: |
          mkdir -p dist/deb/DEBIAN dist/deb/usr/bin dist/deb/usr/share/applications dist/deb/usr/share/icons/hicolor/scalable/apps
          cp dist/desktop/linux-x64/Veyqo.Desktop dist/deb/usr/bin/veyqo
          chmod +x dist/deb/usr/bin/veyqo
          cp assets/logo.svg dist/deb/usr/share/icons/hicolor/scalable/apps/veyqo.svg

          cat << 'EOF' > dist/deb/usr/share/applications/veyqo.desktop
          [Desktop Entry]
          Name=Veyqo
          Comment=Peer-to-Peer Remote Device Bridge
          Exec=/usr/bin/veyqo
          Icon=veyqo
          Terminal=false
          Type=Application
          Categories=Utility;Network;
          EOF

          cat << 'EOF' > dist/deb/DEBIAN/control
          Package: veyqo
          Version: 1.0.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Samir Neupane (SyntX34) <samirneupane66@gmail.com>
          Description: Peer-to-peer local remote device control suite for desktop and mobile.
          EOF

          mkdir -p dist/installers
          dpkg-deb --build dist/deb dist/installers/Veyqo-v1.0.0-linux-amd64.deb

      - name: Upload Linux Installers
        uses: actions/upload-artifact@v6
        with:
          name: veyqo-desktop-linux
          path: dist/installers/*.deb

  build-desktop-windows:
    name: Build Desktop (Windows Exe & MSI)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Publish Windows Desktop Binary
        run: >
          dotnet publish desktop/Veyqo.Desktop.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o dist/desktop/win-x64

      - name: Build Windows Setup Wizard (.exe) via NSIS
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/installers
          makensis /DPRODUCT_VERSION=1.0.0 packaging/windows/installer.nsi

      - name: Build Windows Installer Package (.msi) via WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix || true
          wix extension add --global WixToolset.UI.wixext || true
          candle packaging/windows/Product.wxs -out dist/desktop/Product.wixobj
          light -ext WixUIExtension dist/desktop/Product.wixobj -out dist/installers/Veyqo-Setup-v1.0.0.msi -b dist/desktop/win-x64

      - name: Copy Standalone Portable Executable (.exe)
        shell: pwsh
        run: Copy-Item dist/desktop/win-x64/Veyqo.Desktop.exe dist/installers/Veyqo-v1.0.0-win-x64-standalone.exe

      - name: Upload Windows Installers
        uses: actions/upload-artifact@v6
        with:
          name: veyqo-desktop-windows
          path: dist/installers/*.*

  build-mobile:
    name: Build Android APK
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Keystore for Release Signing
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Veyqo, OU=Veyqo, O=SyntX34, L=City, S=State, C=US"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Build Official Signed Release APK
        working-directory: mobile
        run: |
          gradle assembleRelease --stacktrace
          mkdir -p ../dist/mobile
          cp app/build/outputs/apk/release/*.apk ../dist/mobile/veyqo-mobile-release.apk

      - name: Upload Mobile APK
        uses: actions/upload-artifact@v6
        with:
          name: veyqo-mobile-release-apk
          path: dist/mobile/*.apk

  release:
    name: Publish GitHub Release
    if: github.event_name == 'workflow_dispatch'
    needs: [build-desktop-linux, build-desktop-windows, build-mobile]
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts

      - name: Resolve Release Version
        id: release_meta
        run: |
          INPUT_VER="${{ github.event.inputs.version }}"
          if [ -n "$INPUT_VER" ]; then
            VERSION="$INPUT_VER"
          else
            VERSION=$(grep -oP '(?<=<Version>)[^<]+' desktop/Veyqo.Desktop.csproj || echo "1.0.0")
          fi
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

          echo "## Veyqo Release ${TAG}" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "### Commit History" >> CHANGELOG.md
          git log -n 15 --pretty=format:"* [%h](https://github.com/${{ github.repository }}/commit/%H) - %s (@%an)" >> CHANGELOG.md
          echo "" >> CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Veyqo ${{ steps.release_meta.outputs.tag }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            release-artifacts/**/Veyqo-Setup-*.exe
            release-artifacts/**/Veyqo-Setup-*.msi
            release-artifacts/**/Veyqo-*-standalone.exe
            release-artifacts/**/Veyqo-*.deb
            release-artifacts/**/veyqo-mobile-*.apk
