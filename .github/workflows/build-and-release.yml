name: Build and Release

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Override base version (e.g. 1.0.1). Leave blank to read from version.txt.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  resolve-version:
    name: Resolve Version and Git Identifier
    runs-on: ubuntu-26.04
    outputs:
      base_version: ${{ steps.version_step.outputs.base_version }}
      git_short: ${{ steps.version_step.outputs.git_short }}
      full_version: ${{ steps.version_step.outputs.full_version }}
      tag_name: ${{ steps.version_step.outputs.tag_name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute Version Information
        id: version_step
        run: |
          OVERRIDE_VER="${{ github.event.inputs.version }}"
          if [ -n "$OVERRIDE_VER" ]; then
            BASE_VER="$OVERRIDE_VER"
          else
            BASE_VER=$(cat version.txt | tr -d '[:space:]')
          fi

          GIT_HASH=$(git rev-parse --short=7 HEAD || echo "a1b2c3d")
          FULL_VER="${BASE_VER}+git${GIT_HASH}"

          echo "base_version=${BASE_VER}" >> $GITHUB_OUTPUT
          echo "git_short=${GIT_HASH}" >> $GITHUB_OUTPUT
          echo "full_version=${FULL_VER}" >> $GITHUB_OUTPUT
          echo "tag_name=v${FULL_VER}" >> $GITHUB_OUTPUT

          echo "Resolved Base Version: ${BASE_VER}"
          echo "Resolved Full Version: ${FULL_VER}"

  build-desktop-linux:
    name: Build Desktop (Linux Deb)
    needs: resolve-version
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Inject Version into C# Source
        run: |
          cat << 'EOF' > desktop/VersionInfo.cs
          namespace Veyqo.Desktop;

          public static class VersionInfo
          {
              public static string Version { get; set; } = "${{ needs.resolve-version.outputs.full_version }}";
          }
          EOF

      - name: Publish Linux Desktop Binary
        run: >
          dotnet publish desktop/Veyqo.Desktop.csproj
          -c Release
          -r linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o dist/desktop/linux-x64

      - name: Build Debian (.deb) Installer Package
        run: |
          mkdir -p dist/deb/DEBIAN dist/deb/usr/bin dist/deb/usr/share/applications dist/deb/usr/share/icons/hicolor/scalable/apps
          cp dist/desktop/linux-x64/Veyqo.Desktop dist/deb/usr/bin/veyqo
          chmod +x dist/deb/usr/bin/veyqo
          cp assets/logo.svg dist/deb/usr/share/icons/hicolor/scalable/apps/veyqo.svg

          cat << 'EOF' > dist/deb/usr/share/applications/veyqo.desktop
          [Desktop Entry]
          Name=Veyqo
          Comment=Peer-to-Peer Remote Device Bridge
          Exec=/usr/bin/veyqo
          Icon=veyqo
          Terminal=false
          Type=Application
          Categories=Utility;Network;
          EOF

          cat << EOF > dist/deb/DEBIAN/control
          Package: veyqo
          Version: ${{ needs.resolve-version.outputs.base_version }}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Samir Neupane (SyntX34) <samirneupane66@gmail.com>
          Description: Peer-to-peer local remote device control suite for desktop and mobile.
          EOF

          mkdir -p dist/installers
          dpkg-deb --build dist/deb "dist/installers/Veyqo-v${{ needs.resolve-version.outputs.full_version }}-linux-amd64.deb"

      - name: Upload Linux Installers
        uses: actions/upload-artifact@v6
        with:
          name: veyqo-desktop-linux
          path: dist/installers/*.deb

  build-desktop-windows:
    name: Build Desktop (Windows Exe & MSI)
    needs: resolve-version
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Install Packaging Tools (NSIS & WiX)
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
          "C:\Program Files\NSIS" >> $env:GITHUB_PATH

          $wixDir = Get-ChildItem -Path "C:\Program Files (x86)" -Filter "WiX Toolset*" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($wixDir) {
            "$($wixDir.FullName)\bin" >> $env:GITHUB_PATH
          } else {
            dotnet tool install --global wix || true
          }

      - name: Inject Version into C# Source
        shell: pwsh
        run: |
          @"
          namespace Veyqo.Desktop;

          public static class VersionInfo
          {
              public static string Version { get; set; } = "${{ needs.resolve-version.outputs.full_version }}";
          }
          "@ | Set-Content -Path desktop/VersionInfo.cs

      - name: Publish Windows Desktop Binary
        run: >
          dotnet publish desktop/Veyqo.Desktop.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o dist/desktop/win-x64

      - name: Build Windows Setup Wizard (.exe) via NSIS
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/installers
          $makensisPath = (Get-Command makensis.exe -ErrorAction SilentlyContinue)?.Source
          if (-not $makensisPath) {
            if (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") {
              $makensisPath = "C:\Program Files (x86)\NSIS\makensis.exe"
            } elseif (Test-Path "C:\Program Files\NSIS\makensis.exe") {
              $makensisPath = "C:\Program Files\NSIS\makensis.exe"
            }
          }
          & $makensisPath /DPRODUCT_VERSION="${{ needs.resolve-version.outputs.full_version }}" packaging/windows/installer.nsi

      - name: Build Windows Installer Package (.msi) via WiX Toolset
        shell: pwsh
        run: |
          $candlePath = (Get-Command candle.exe -ErrorAction SilentlyContinue)?.Source
          $lightPath = (Get-Command light.exe -ErrorAction SilentlyContinue)?.Source

          if ($candlePath -and $lightPath) {
            & $candlePath packaging/windows/Product.wxs -out dist/desktop/Product.wixobj
            & $lightPath -ext WixUIExtension dist/desktop/Product.wixobj -out "dist/installers/Veyqo-Setup-v${{ needs.resolve-version.outputs.full_version }}.msi" -b dist/desktop/win-x64
          } else {
            wix build packaging/windows/Product.wxs -out "dist/installers/Veyqo-Setup-v${{ needs.resolve-version.outputs.full_version }}.msi"
          }

      - name: Copy Standalone Portable Executable (.exe)
        shell: pwsh
        run: Copy-Item dist/desktop/win-x64/Veyqo.Desktop.exe "dist/installers/Veyqo-v${{ needs.resolve-version.outputs.full_version }}-win-x64-standalone.exe"

      - name: Upload Windows Installers
        uses: actions/upload-artifact@v6
        with:
          name: veyqo-desktop-windows
          path: dist/installers/*.*

  build-mobile:
    name: Build Android APK
    needs: resolve-version
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Build Official Signed Release APK
        working-directory: mobile
        env:
          GIT_COMMIT_HASH: ${{ needs.resolve-version.outputs.git_short }}
        run: |
          gradle assembleRelease --stacktrace
          mkdir -p ../dist/mobile
          cp app/build/outputs/apk/release/*.apk "../dist/mobile/veyqo-mobile-v${{ needs.resolve-version.outputs.full_version }}-release.apk"

      - name: Upload Mobile APK
        uses: actions/upload-artifact@v6
        with:
          name: veyqo-mobile-release-apk
          path: dist/mobile/*.apk

  release:
    name: Publish GitHub Release
    if: github.event_name == 'workflow_dispatch'
    needs: [resolve-version, build-desktop-linux, build-desktop-windows, build-mobile]
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts

      - name: Generate Changelog
        run: |
          TAG="${{ needs.resolve-version.outputs.tag_name }}"
          echo "## Veyqo Release ${TAG}" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "### What's Changed" >> CHANGELOG.md

          # Fetch all tags so we can determine the previous release tag
          git fetch --tags --force || true
          PREV_TAG=$(git tag --sort=-creatordate | head -n 1 || echo "")

          if [ -n "$PREV_TAG" ]; then
            echo "*Changes since tag \`${PREV_TAG}\`:*" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            git log "${PREV_TAG}..HEAD" --pretty=format:"* [%h](https://github.com/${{ github.repository }}/commit/%H) - %s (@%an)" >> CHANGELOG.md
          else
            echo "*Initial release changes:*" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            git log -n 10 --pretty=format:"* [%h](https://github.com/${{ github.repository }}/commit/%H) - %s (@%an)" >> CHANGELOG.md
          fi
          echo "" >> CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag_name }}
          name: Veyqo ${{ needs.resolve-version.outputs.tag_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            release-artifacts/**/Veyqo-Setup-*.exe
            release-artifacts/**/Veyqo-Setup-*.msi
            release-artifacts/**/Veyqo-*-standalone.exe
            release-artifacts/**/Veyqo-*.deb
            release-artifacts/**/veyqo-mobile-*.apk
